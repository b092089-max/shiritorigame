function start(){score=0;used=new Set();locked=false;const starts=shuffle(usable.filter(w=>candidatesForStart(w)>0&& !previousStarts.includes(w[0])));current=(starts[0]||shuffle(usable.filter(w=>candidatesForStart(w)>0))[0]);previousStarts.push(current[0]);if(previousStarts.length>30)previousStarts.shift();used.add(current[0]);render()}
function candidatesForStart(w){return usable.filter(v=>first(v[0])===last(w[0])&&v[0]!==w[0]).length}
function render(){let valid=candidates(last(current[0]));if(!valid.length){const next=shuffle(usable.filter(w=>!used.has(w[0])&&candidatesForStart(w)>0))[0];if(next){current=next;used.add(current[0]);valid=candidates(last(current[0]))}else{used=new Set();current=shuffle(usable.filter(w=>candidatesForStart(w)>0))[0];used.add(current[0]);valid=candidates(last(current[0]))}}
 document.getElementById('score').textContent=`⭐ ${score} / 10`;
 document.getElementById('word').textContent=current[1]+' '+current[0];const c=last(current[0]);document.getElementById('prompt').textContent=`「${c}」から はじまる ことばは？`;
 document.getElementById('status').textContent='えらんで みよう！';
 // Show multiple correct answers when possible, so the child chooses the path.
 const good=shuffle(valid).slice(0,2);const bad=shuffle(usable.filter(w=>first(w[0])!==c&&!used.has(w[0]))).slice(0,2);const options=shuffle([...good,...bad]);
 const root=document.getElementById('choices');root.innerHTML='';locked=false;
 options.forEach(w=>{const b=document.createElement('button');b.className='choice';b.textContent=w[1]+' '+w[0];b.onclick=()=>choose(w,b);root.appendChild(b)})}
function choose(w,b){if(locked)return;if(first(w[0])!==last(current[0])){document.getElementById('status').textContent='😊 おしい！ もういちど！';b.disabled=true;return}
 locked=true;score++;used.add(w[0]);current=w;document.getElementById('status').textContent='🎉 せいかい！ すごい！';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);
 if(score>=10){document.getElementById('score').textContent='⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐';document.getElementById('prompt').textContent='10もん せいかい！';document.getElementById('status').textContent='🏆 おめでとう！ クリア！';document.getElementById('word').textContent='🎊 やったね！';return}setTimeout(render,800)}start();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>わくわく しりとり</title><style>body{margin:0;background:#fff4cf;font-family:system-ui,sans-serif;color:#473625;text-align:center}.wrap{max-width:650px;margin:auto;padding:20px}h1{font-size:clamp(30px,7vw,46px);color:#f16a78}.panel{background:white;border-radius:28px;padding:22px;box-shadow:0 8px 0 #f1dca8}.word{font-size:clamp(38px,10vw,65px);font-weight:bold;margin:15px}.hint{font-size:24px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:22px;padding:20px 8px;font-size:clamp(21px,5vw,30px);font-weight:bold;background:#d9f5ff;box-shadow:0 5px 0 #94cbdc;min-height:100px}button:active{transform:translateY(4px);box-shadow:none}button:disabled{opacity:.7}.choice:nth-child(2){background:#ffe2e9;box-shadow:0 5px 0 #e8abbc}.choice:nth-child(3){background:#e1f8d6;box-shadow:0 5px 0 #b3d4a3}.choice:nth-child(4){background:#efe4ff;box-shadow:0 5px 0 #c9b4e8}.status{font-size:23px;min-height:65px;font-weight:bold}.small{font-size:18px}.restart{background:#ffd06d;min-height:55px;padding:12px 28px;font-size:20px}.hidden{display:none}</style></head><body><div class="wrap"><h1>🌈 わくわく しりとり 🌈</h1><div class="panel"><div id="score" class="small">⭐ 0 / 10</div><div class="hint">この ことばに つなげよう！</div><div id="word" class="word">🍎 りんご</div><div id="prompt" class="hint">「ご」から はじまる ことばは？</div><div id="choices" class="choices"></div><div id="status" class="status" aria-live="polite">えらんで みよう！</div><button class="restart" onclick="start()">🔄 はじめから</button></div></div><script>
const words=[['りんご','🍎'],['ごりら','🦍'],['らっぱ','🎺'],['ぱんだ','🐼'],['だるま','🔴'],['まくら','🛏️'],['らくだ','🐪'],['たいこ','🥁'],['こあら','🐨'],['あひる','🦆'],['るすばん','🏠'],['さかな','🐟'],['なす','🍆'],['すいか','🍉'],['かめ','🐢'],['めがね','👓'],['ねこ','🐱'],['こま','🪀'],['まめ','🫘'],['めろん','🍈'],['くま','🐻'],['まり','⚽'],['りす','🐿️'],['すずめ','🐦'],['えび','🦐'],['びわ','🍊'],['わに','🐊'],['にわとり','🐓'],['いぬ','🐶'],['ぬいぐるみ','🧸'],['みかん','🍊'],['みみ','👂'],['みず','💧'],['ぞう','🐘'],['うし','🐄'],['しか','🦌'],['かさ','☂️'],['さる','🐒'],['るびー','💎'],['いちご','🍓'],['ごま','⚫'],['まつり','🏮'],['りぼん','🎀'],['ほし','⭐'],['しお','🧂'],['おに','👹'],['にじ','🌈'],['じてんしゃ','🚲'],['やま','⛰️'],['まぐろ','🐟'],['ろば','🫏'],['ばなな','🍌'],['なべ','🍲'],['べる','🔔'],['るーれっと','🎡'],['とまと','🍅'],['とら','🐯'],['らいおん','🦁'],['ひよこ','🐤'],['こっぷ','🥛'],['ぷりん','🍮'],["あめ","🍬"],["あさ","🌅"],["あし","🦶"],["あたま","🙂"],["あか","🔴"],["あお","🔵"],["あき","🍂"],["いえ","🏠"],["いす","🪑"],["いけ","🏞️"],["いと","🧵"],["いか","🦑"],["いし","🪨"],["いも","🍠"],["うま","🐴"],["うみ","🌊"],["うた","🎵"],["うで","💪"],["うちわ","🪭"],["うきわ","🛟"],["うさぎ","🐰"],["えき","🚉"],["えほん","📖"],["えんぴつ","✏️"],["えだ","🌿"],["えのぐ","🎨"],["えがお","😊"],["えぷろん","👗"],["おかし","🍪"],["おちゃ","🍵"],["おさら","🍽️"],["おふろ","🛁"],["おか","⛰️"],["おと","🎶"],["おにぎり","🍙"],["かに","🦀"],["かえる","🐸"],["かぎ","🔑"],["かお","😀"],["かみ","📄"],["かぼちゃ","🎃"],["かぶ","🥬"],["きつね","🦊"],["きりん","🦒"],["きのこ","🍄"],["きゅうり","🥒"],["きしゃ","🚂"],["きもの","👘"],["きいろ","🟡"],["くつ","👟"],["くじら","🐳"],["くるま","🚗"],["くし","🪮"],["くち","👄"],["くり","🌰"],["くさ","🌱"],["けーき","🍰"],["けむし","🐛"],["けしごむ","🧽"],["けいと","🧶"],["けが","🩹"],["けむり","💨"],["けんだま","🪀"],["こいぬ","🐶"],["こねこ","🐱"],["こおり","🧊"],["こども","🧒"],["こいのぼり","🎏"],["こめ","🍚"],["こぶた","🐷"],["さくら","🌸"],["さとう","🍬"],["さつまいも","🍠"],["さめ","🦈"],["さくらんぼ","🍒"],["さぼてん","🌵"],["さつき","🌺"],["しろ","⚪"],["しまうま","🦓"],["しんごう","🚦"],["しっぽ","🐕"],["しろくま","🐻‍❄️"],["しゃぼんだま","🫧"],["しんぶん","📰"],["すし","🍣"],["すな","🏖️"],["すべりだい","🛝"],["すぷーん","🥄"],["すみれ","🌸"],["すいとう","🚰"],["すもう","🤼"],["せみ","🪲"],["せなか","🧍"],["せっけん","🧼"],["せんべい","🍘"],["せんぷうき","🌀"],["せいふく","👕"],["せかい","🌏"],["そら","☀️"],["そり","🛷"],["そふぁ","🛋️"],["そーせーじ","🌭"],["そと","🌳"],["そば","🍜"],["そくたつ","📦"],["たこ","🐙"],["たまご","🥚"],["たぬき","🦝"],["たけ","🎋"],["たまねぎ","🧅"],["たいや","🛞"],["たんぽぽ","🌼"],["ちず","🗺️"],["ちょうちょ","🦋"],["ちーず","🧀"],["ちくわ","🍢"],["ちかてつ","🚇"],["ちゅーりっぷ","🌷"],["ちりとり","🧹"],["つき","🌙"],["つくえ","🪑"],["つみき","🧱"],["つばめ","🐦"],["つの","🦌"],["つち","🟤"],["つり","🎣"],["て","✋"],["てがみ","💌"],["てぶくろ","🧤"],["てんとうむし","🐞"],["てれび","📺"],["てーぶる","🪑"],["てぃっしゅ","🧻"],["とけい","🕒"],["とり","🐦"],["とうふ","⬜"],["とんぼ","🪰"],["とびら","🚪"],["とらっく","🚚"],["とんかつ","🍖"],["なわとび","🪢"],["なみ","🌊"],["なみだ","💧"],["なまえ","📛"],["なかま","🧑‍🤝‍🧑"],["なっとう","🫘"],["なつ","🌻"],["にく","🍖"],["にんじん","🥕"],["にわ","🌷"],["にっき","📓"],["にこにこ","😊"],["にもの","🍲"],["にんぎょう","🪆"],["ぬの","🧵"],["ぬま","🏞️"],["ぬりえ","🖍️"],["ぬりかべ","🧱"],["ぬか","🌾"],["ねずみ","🐭"],["ねぎ","🥬"],["ねつ","🌡️"],["ねんど","🟤"],["ねがお","😴"],["ねまき","👕"],["のり","🍙"],["のはら","🌼"],["のこぎり","🪚"],["のりもの","🚙"],["のーと","📓"],["はな","🌷"],["はさみ","✂️"],["はし","🥢"],["はっぱ","🍃"],["はぶらし","🪥"],["はこ","📦"],["はち","🐝"],["ひまわり","🌻"],["ひこうき","✈️"],["ひつじ","🐑"],["ひとで","⭐"],["ひかり","💡"],["ひざ","🦵"],["ひも","🪢"],["ふね","🚢"],["ふうせん","🎈"],["ふく","👕"],["ふくろ","🛍️"],["ふとん","🛏️"],["ふえ","🪈"],["ふじ","🗻"],["へび","🐍"],["へや","🏠"],["へそ","🙂"],["へるめっと","🪖"],["へい","🧱"],["へちま","🥒"],["へら","🥄"],["ほたる","✨"],["ほうき","🧹"]];
let current,used,score,locked;
const last=s=>s.slice(-1);const first=s=>s[0];const usable=words.filter(w=>!['ん','ー'].includes(last(w[0])));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function randomStart(){const candidates=usable.filter(w=>usable.some(v=>first(v[0])===last(w[0])&&v[0]!==w[0]));return candidates[Math.floor(Math.random()*candidates.length)]}
function start(){score=0;used=new Set();locked=false;current=randomStart();used.add(current[0]);render()}
function render(){document.getElementById('score').textContent=`⭐ ${score} / 10`;document.getElementById('word').textContent=current[1]+' '+current[0];let c=last(current[0]);document.getElementById('prompt').textContent=`「${c}」から はじまる ことばは？`;document.getElementById('status').textContent='えらんで みよう！';let valid=usable.filter(w=>first(w[0])===c&&!used.has(w[0]));if(!valid.length){current=shuffle(usable.filter(w=>usable.some(v=>first(v[0])===last(w[0]))))[0];used=new Set([current[0]]);render();return}let correct=shuffle(valid)[0];let wrong=shuffle(words.filter(w=>first(w[0])!==c&&w[0]!==current[0])).slice(0,3);let options=shuffle([correct,...wrong]);let root=document.getElementById('choices');root.innerHTML='';locked=false;options.forEach(w=>{let b=document.createElement('button');b.className='choice';b.textContent=w[1]+' '+w[0];b.onclick=()=>choose(w,correct,b);root.appendChild(b)})}
function choose(w,correct,b){if(locked)return;if(w[0]!==correct[0]){document.getElementById('status').textContent='😊 おしい！ もういちど！';b.disabled=true;return}locked=true;score++;used.add(w[0]);current=w;document.getElementById('status').textContent='🎉 せいかい！ すごい！';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(score>=10){document.getElementById('score').textContent='⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐';document.getElementById('prompt').textContent='10もん せいかい！';document.getElementById('status').textContent='🏆 おめでとう！ クリア！';document.getElementById('word').textContent='🎊 やったね！';return}setTimeout(render,950)}start();</script></body></html>
